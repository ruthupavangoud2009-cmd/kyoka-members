services:
  - type: web
    name: nexuver-24-7-bot
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: BOT_PREFIX
        value: "!"
      - key: PORT
        value: "8080"
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: AFHAMXMAILZ_KEY
        sync: false
      - key: NINECAPTCHA_KEY
        sync: false
      - key: PHONE_SERVICE
        value: "5sim"
      - key: FIVESIM_KEY
        sync: false
      - key: ONYX_KEY
        sync: false

